<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the e2e browser, set as FONTCONFIG_FILE by test_helper.exs.

  The dashboard's font stack is the system one (system-ui, then sans-serif),
  so the width of every line, and with it whether a wizard step fits one
  screen, depends on whatever the machine resolves those names to. A bare
  Linux box answers DejaVu Sans, far wider than the San Francisco, Segoe UI,
  Roboto or Arial a visitor sees, and the layout assertions then fail there
  and pass elsewhere. Liberation Sans has Arial's metrics, and Chrome's
  Debian package depends on it (fonts-liberation), so every machine with
  Chrome draws the same lines.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
