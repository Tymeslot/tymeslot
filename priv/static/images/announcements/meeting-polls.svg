<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img" aria-label="A poll grid of candidate times with votes, an invitation envelope and a confirmed meeting">
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="mp-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="240" fill="url(#mp-bg)"/>

  <!-- the invitation -->
  <g filter="url(#mp-shadow)">
    <rect x="48" y="70" width="136" height="96" rx="14" fill="#ffffff"/>
  </g>
  <path d="M60 84 L116 124 L172 84" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="140" width="72" height="8" rx="4" fill="#cbd5e1"/>

  <!-- the poll grid: three times, three voters -->
  <g filter="url(#mp-shadow)">
    <rect x="216" y="36" width="232" height="168" rx="18" fill="#ffffff"/>
  </g>
  <rect x="236" y="58" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="236" y="84" width="192" height="30" rx="10" fill="#ccfbf1"/>
  <rect x="248" y="95" width="48" height="8" rx="4" fill="#0d9488"/>
  <circle cx="352" cy="99" r="9" fill="#0d9488"/>
  <circle cx="378" cy="99" r="9" fill="#0d9488"/>
  <circle cx="404" cy="99" r="9" fill="#5eead4"/>
  <rect x="236" y="122" width="192" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="248" y="133" width="40" height="8" rx="4" fill="#cbd5e1"/>
  <circle cx="352" cy="137" r="9" fill="#5eead4"/>
  <circle cx="378" cy="137" r="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="404" cy="137" r="9" fill="#0d9488"/>
  <rect x="236" y="160" width="192" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="248" y="171" width="44" height="8" rx="4" fill="#cbd5e1"/>
  <circle cx="352" cy="175" r="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="378" cy="175" r="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="404" cy="175" r="9" fill="#5eead4"/>

  <!-- the confirmed meeting -->
  <g filter="url(#mp-shadow)">
    <rect x="480" y="66" width="112" height="108" rx="16" fill="#ffffff"/>
  </g>
  <rect x="480" y="66" width="112" height="26" rx="13" fill="#0d9488"/>
  <rect x="480" y="80" width="112" height="12" fill="#0d9488"/>
  <path d="M514 132 L530 148 L560 116" stroke="#0d9488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
