<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img" aria-label="More video providers to choose from">
  <defs>
    <linearGradient id="video-providers-bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="video-providers-tile" x1="164" y1="148" x2="476" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="video-providers-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="240" fill="url(#video-providers-bg)"/>

  <!-- the video provider picker -->
  <g filter="url(#video-providers-shadow)">
    <rect x="140" y="40" width="360" height="160" rx="18" fill="#ffffff"/>
  </g>
  <path d="M140 58 a18 18 0 0 1 18 -18 h324 a18 18 0 0 1 18 18 v24 h-360 z" fill="#0d9488"/>
  <rect x="164" y="56" width="132" height="10" rx="5" fill="#99f6e4"/>

  <!-- providers already on offer -->
  <g fill="#f1f5f9">
    <rect x="164" y="98" width="92" height="44" rx="10"/>
    <rect x="274" y="98" width="92" height="44" rx="10"/>
    <rect x="384" y="98" width="92" height="44" rx="10"/>
  </g>
  <g fill="#cbd5e1">
    <rect x="196" y="112" width="20" height="14" rx="3"/>
    <path d="M216 116 l10 -5 v14 l-10 -5 z"/>
    <rect x="306" y="112" width="20" height="14" rx="3"/>
    <path d="M326 116 l10 -5 v14 l-10 -5 z"/>
    <rect x="416" y="112" width="20" height="14" rx="3"/>
    <path d="M436 116 l10 -5 v14 l-10 -5 z"/>
  </g>

  <!-- the three that are new -->
  <g fill="url(#video-providers-tile)">
    <rect x="164" y="148" width="92" height="44" rx="10"/>
    <rect x="274" y="148" width="92" height="44" rx="10"/>
    <rect x="384" y="148" width="92" height="44" rx="10"/>
  </g>
  <g fill="#ffffff">
    <rect x="196" y="162" width="20" height="14" rx="3"/>
    <path d="M216 166 l10 -5 v14 l-10 -5 z"/>
    <rect x="306" y="162" width="20" height="14" rx="3"/>
    <path d="M326 166 l10 -5 v14 l-10 -5 z"/>
    <rect x="416" y="162" width="20" height="14" rx="3"/>
    <path d="M436 166 l10 -5 v14 l-10 -5 z"/>
  </g>

  <!-- the room each booking gets -->
  <g filter="url(#video-providers-shadow)">
    <rect x="516" y="86" width="96" height="68" rx="14" fill="#14b8a6"/>
  </g>
  <rect x="540" y="110" width="32" height="22" rx="5" fill="#ffffff"/>
  <path d="M572 117 l14 -7 v22 l-14 -7 z" fill="#ffffff"/>
  <path d="M500 120 h16" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
</svg>
