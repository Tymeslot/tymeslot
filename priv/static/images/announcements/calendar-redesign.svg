<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img" aria-label="A week calendar with a view switcher, an event dragged to a new time, hatched bookable times, a Ctrl K command bar and numbered calendar sets">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <pattern id="cr-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f0fdfa"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5eead4" stroke-width="3"/>
    </pattern>
    <filter id="cr-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="240" fill="url(#cr-bg)"/>

  <!-- the calendar card -->
  <g filter="url(#cr-shadow)">
    <rect x="64" y="24" width="384" height="192" rx="18" fill="#ffffff"/>
  </g>

  <!-- view switcher: day, 3 days, week (current), month, agenda -->
  <rect x="84" y="40" width="64" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="236" y="36" width="192" height="18" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="244" y="42" width="26" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="280" y="42" width="26" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="312" y="38" width="38" height="14" rx="7" fill="#0d9488"/>
  <rect x="356" y="42" width="26" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="392" y="42" width="26" height="6" rx="3" fill="#cbd5e1"/>

  <!-- the week grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="84" y1="72" x2="428" y2="72"/>
    <line x1="84" y1="104" x2="428" y2="104"/>
    <line x1="84" y1="136" x2="428" y2="136"/>
    <line x1="84" y1="168" x2="428" y2="168"/>
    <line x1="84" y1="200" x2="428" y2="200"/>
  </g>
  <rect x="104" y="62" width="24" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="172" y="62" width="24" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="240" y="62" width="24" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="308" y="62" width="24" height="5" rx="2.5" fill="#0d9488"/>
  <rect x="376" y="62" width="24" height="5" rx="2.5" fill="#cbd5e1"/>

  <!-- events -->
  <rect x="88" y="78" width="60" height="40" rx="8" fill="#0d9488"/>
  <rect x="96" y="88" width="34" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
  <rect x="224" y="142" width="60" height="30" rx="8" fill="#ccfbf1"/>
  <rect x="232" y="152" width="30" height="6" rx="3" fill="#0f766e" opacity="0.6"/>
  <rect x="360" y="94" width="60" height="52" rx="8" fill="#ccfbf1"/>
  <rect x="368" y="104" width="36" height="6" rx="3" fill="#0f766e" opacity="0.6"/>

  <!-- bookable times for a meeting type, hatched -->
  <rect x="156" y="108" width="60" height="88" rx="8" fill="url(#cr-hatch)" stroke="#5eead4"/>

  <!-- an event dragged from its old time to a new one -->
  <rect x="292" y="78" width="60" height="36" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M322 118 L322 134" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>
  <path d="M315 128 L322 136 L329 128" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#cr-shadow)">
    <rect x="292" y="142" width="60" height="36" rx="8" fill="#0d9488"/>
  </g>
  <rect x="300" y="152" width="34" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
  <path d="M340 166 L340 190 L346 184 L351 194 L355 192 L350 182 L358 182 Z" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- the command bar: Ctrl K to search and run commands -->
  <g filter="url(#cr-shadow)">
    <rect x="476" y="44" width="124" height="68" rx="14" fill="#ffffff"/>
  </g>
  <rect x="490" y="58" width="36" height="22" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="508" y="74" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">Ctrl</text>
  <rect x="532" y="58" width="22" height="22" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="543" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">K</text>
  <circle cx="575" cy="68" r="6" stroke="#14b8a6" stroke-width="2.5"/>
  <path d="M579 72 L584 77" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="490" y="92" width="96" height="6" rx="3" fill="#e2e8f0"/>

  <!-- calendar sets on the number keys -->
  <g filter="url(#cr-shadow)">
    <rect x="476" y="132" width="124" height="60" rx="14" fill="#ffffff"/>
  </g>
  <rect x="490" y="148" width="28" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="504" y="167" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">1</text>
  <rect x="524" y="148" width="28" height="28" rx="8" fill="#0d9488"/>
  <text x="538" y="167" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="558" y="148" width="28" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="572" y="167" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">3</text>
</svg>
