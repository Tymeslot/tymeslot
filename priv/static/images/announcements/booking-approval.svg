<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img" aria-label="A booking request waiting for the host's approval, with approve and decline actions">
  <defs>
    <linearGradient id="ba-bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="ba-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="240" fill="url(#ba-bg)"/>

  <!-- the request card the host answers -->
  <g filter="url(#ba-shadow)">
    <rect x="64" y="44" width="288" height="152" rx="18" fill="#ffffff"/>
  </g>

  <!-- "awaiting approval" pill -->
  <rect x="88" y="68" width="104" height="20" rx="10" fill="#fef3c7"/>
  <circle cx="100" cy="78" r="4" fill="#f59e0b"/>
  <rect x="110" y="75" width="70" height="6" rx="3" fill="#b45309"/>

  <!-- who and when -->
  <rect x="88" y="102" width="128" height="9" rx="4.5" fill="#334155"/>
  <rect x="88" y="120" width="184" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="88" y="134" width="152" height="6" rx="3" fill="#cbd5e1"/>

  <!-- approve / decline -->
  <rect x="88" y="158" width="104" height="26" rx="13" fill="#0d9488"/>
  <path d="M108 171l5 5 9-10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="130" y="168" width="46" height="6" rx="3" fill="#ffffff" opacity="0.9"/>

  <rect x="200" y="158" width="104" height="26" rx="13" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <path d="M219 166l12 12M231 166l-12 12" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="242" y="168" width="46" height="6" rx="3" fill="#fca5a5"/>

  <!-- the held slot on the calendar, tentative until answered -->
  <g filter="url(#ba-shadow)">
    <rect x="400" y="60" width="176" height="120" rx="16" fill="#ffffff"/>
  </g>
  <rect x="422" y="82" width="64" height="7" rx="3.5" fill="#cbd5e1"/>

  <!-- a confirmed booking above, the held one below in dashed amber -->
  <rect x="422" y="102" width="132" height="22" rx="8" fill="#ccfbf1"/>
  <rect x="434" y="110" width="72" height="6" rx="3" fill="#0f766e"/>

  <rect x="422" y="134" width="132" height="22" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="434" y="142" width="60" height="6" rx="3" fill="#b45309"/>

  <!-- the hold is still a hold: nobody else can take it -->
  <path d="M576 120h18" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
