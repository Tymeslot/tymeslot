<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img" aria-label="Guest attendees and RSVP">
  <defs>
    <linearGradient id="guest-bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="guest-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="240" fill="url(#guest-bg)"/>
  <g filter="url(#guest-shadow)">
    <rect x="180" y="36" width="280" height="168" rx="18" fill="#ffffff"/>
  </g>
  <rect x="204" y="60" width="96" height="16" rx="8" fill="#0d9488"/>

  <!-- guest row 1: organiser, accepted -->
  <circle cx="216" cy="104" r="13" fill="#0d9488"/>
  <circle cx="216" cy="101" r="4.5" fill="#ffffff"/>
  <path d="M210 112 a6 6 0 0 1 12 0" fill="#ffffff"/>
  <rect x="240" y="95" width="120" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="240" y="108" width="70" height="7" rx="3" fill="#e2e8f0"/>
  <circle cx="430" cy="104" r="11" fill="#14b8a6"/>
  <path d="M425 104 l3 3 l6 -7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- guest row 2: guest, accepted -->
  <circle cx="216" cy="142" r="13" fill="#22d3ee"/>
  <circle cx="216" cy="139" r="4.5" fill="#ffffff"/>
  <path d="M210 150 a6 6 0 0 1 12 0" fill="#ffffff"/>
  <rect x="240" y="133" width="100" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="240" y="146" width="80" height="7" rx="3" fill="#e2e8f0"/>
  <circle cx="430" cy="142" r="11" fill="#14b8a6"/>
  <path d="M425 142 l3 3 l6 -7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- guest row 3: guest, pending -->
  <circle cx="216" cy="180" r="13" fill="#cbd5e1"/>
  <circle cx="216" cy="177" r="4.5" fill="#ffffff"/>
  <path d="M210 188 a6 6 0 0 1 12 0" fill="#ffffff"/>
  <rect x="240" y="171" width="84" height="9" rx="4" fill="#e2e8f0"/>
  <rect x="240" y="184" width="60" height="7" rx="3" fill="#e2e8f0"/>
  <circle cx="430" cy="180" r="11" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="425" cy="180" r="1.5" fill="#cbd5e1"/>
  <circle cx="430" cy="180" r="1.5" fill="#cbd5e1"/>
  <circle cx="435" cy="180" r="1.5" fill="#cbd5e1"/>

  <!-- RSVP invitation badge -->
  <circle cx="452" cy="56" r="22" fill="#22d3ee"/>
  <rect x="441" y="49" width="22" height="15" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M441.5 51 l10.5 8 l10.5 -8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
