<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img" aria-label="Colour-coded calendar events">
  <defs>
    <linearGradient id="col-bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="col-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="240" fill="url(#col-bg)"/>

  <!-- agenda card with colour-coded event chips -->
  <g filter="url(#col-shadow)">
    <rect x="96" y="44" width="300" height="152" rx="18" fill="#ffffff"/>
  </g>

  <!-- event 1 (teal) -->
  <rect x="116" y="64" width="260" height="30" rx="9" fill="#ccfbf1"/>
  <rect x="116" y="64" width="7" height="30" rx="3.5" fill="#0d9488"/>
  <rect x="138" y="72" width="120" height="7" rx="3.5" fill="#5eead4"/>
  <rect x="138" y="83" width="78" height="6" rx="3" fill="#99f6e4"/>

  <!-- event 2 (indigo) -->
  <rect x="116" y="102" width="260" height="30" rx="9" fill="#e0e7ff"/>
  <rect x="116" y="102" width="7" height="30" rx="3.5" fill="#6366f1"/>
  <rect x="138" y="110" width="104" height="7" rx="3.5" fill="#a5b4fc"/>
  <rect x="138" y="121" width="70" height="6" rx="3" fill="#c7d2fe"/>

  <!-- event 3 (amber) -->
  <rect x="116" y="140" width="260" height="30" rx="9" fill="#fef3c7"/>
  <rect x="116" y="140" width="7" height="30" rx="3.5" fill="#f59e0b"/>
  <rect x="138" y="148" width="132" height="7" rx="3.5" fill="#fcd34d"/>
  <rect x="138" y="159" width="86" height="6" rx="3" fill="#fde68a"/>

  <!-- colour picker card -->
  <g filter="url(#col-shadow)">
    <rect x="452" y="66" width="120" height="108" rx="16" fill="#ffffff"/>
  </g>
  <rect x="472" y="82" width="80" height="7" rx="3.5" fill="#cbd5e1"/>

  <!-- swatches; the teal one is selected (ring) -->
  <circle cx="486" cy="116" r="12" fill="#0d9488"/>
  <circle cx="486" cy="116" r="16" fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="519" cy="116" r="12" fill="#6366f1"/>
  <circle cx="552" cy="116" r="12" fill="#f59e0b"/>
  <circle cx="486" cy="150" r="12" fill="#06b6d4"/>
  <circle cx="519" cy="150" r="12" fill="#f43f5e"/>
  <circle cx="552" cy="150" r="12" fill="#8b5cf6"/>
</svg>
