<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none" role="img" aria-label="Meeting payments">
  <defs>
    <linearGradient id="pay-bg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="pay-card" x1="404" y1="58" x2="536" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="pay-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d9488" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="640" height="240" fill="url(#pay-bg)"/>
  <g filter="url(#pay-shadow)">
    <rect x="150" y="44" width="300" height="152" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="186" cy="80" r="14" fill="#99f6e4"/>
  <rect x="210" y="71" width="120" height="9" rx="4" fill="#cbd5e1"/>
  <rect x="210" y="87" width="80" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="174" y="112" width="252" height="1.5" fill="#eef2f6"/>
  <text x="174" y="160" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#0f766e">$50</text>
  <rect x="320" y="132" width="106" height="40" rx="12" fill="#0d9488"/>
  <text x="373" y="157" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Pay</text>
  <g transform="rotate(-12 470 88)" filter="url(#pay-shadow)">
    <rect x="404" y="58" width="132" height="84" rx="12" fill="url(#pay-card)"/>
    <rect x="418" y="78" width="26" height="20" rx="4" fill="#fde68a"/>
    <rect x="418" y="112" width="96" height="7" rx="3.5" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
