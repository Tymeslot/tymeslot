<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <style>
    /* Blinking cursor at end of name line */
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typing-cursor {
      animation: cursor-blink 1s step-end infinite;
    }

    /* Gentle avatar pulse */
    @keyframes avatar-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .avatar {
      transform-origin: 300px 104px;
      animation: avatar-pulse 3s ease-in-out infinite;
    }

    /* Staggered calendar cell fade-in */
    @keyframes cell-fade {
      0%, 5% { opacity: 0; }
      15%, 80% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }
    .cal-cell {
      animation: cell-fade 4.5s ease-in-out infinite;
    }
    .cal-cell:nth-child(1) { animation-delay: 0s; }
    .cal-cell:nth-child(2) { animation-delay: 0.2s; }
    .cal-cell:nth-child(3) { animation-delay: 0.4s; }
    .cal-cell:nth-child(4) { animation-delay: 0.6s; }
    .cal-cell:nth-child(5) { animation-delay: 0.8s; }
    .cal-cell:nth-child(6) { animation-delay: 1.0s; }
    .cal-cell:nth-child(7) { animation-delay: 1.2s; }
    .cal-cell:nth-child(8) { animation-delay: 1.4s; }
    .cal-cell:nth-child(9) { animation-delay: 1.6s; }
  </style>

  <!-- Shadow behind main card -->
  <rect x="134" y="44" width="340" height="430" rx="12" fill="#e2e8f0" opacity="0.6"/>

  <!-- Main card -->
  <rect x="130" y="38" width="340" height="430" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Avatar circle -->
  <circle class="avatar" cx="300" cy="104" r="30" fill="#e2e8f0"/>

  <!-- Name line 1 (wider) -->
  <rect x="230" y="150" width="140" height="12" rx="6" fill="#cbd5e1"/>

  <!-- Typing cursor -->
  <rect class="typing-cursor" x="372" y="149" width="2" height="14" rx="1" fill="#94a3b8"/>

  <!-- Name line 2 (narrower) -->
  <rect x="250" y="172" width="100" height="10" rx="5" fill="#cbd5e1"/>

  <!-- URL bar -->
  <rect x="170" y="206" width="260" height="36" rx="8" fill="#f1f5f9"/>

  <!-- Link/chain icon in URL bar -->
  <g transform="translate(184, 216)">
    <path d="M6.5 8.5a3.5 3.5 0 0 1 0-5l2-2a3.5 3.5 0 0 1 5 5l-0.5 0.5" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M9.5 7.5a3.5 3.5 0 0 1 0 5l-2 2a3.5 3.5 0 0 1-5-5l0.5-0.5" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- URL placeholder bar -->
  <rect x="210" y="218" width="140" height="10" rx="5" fill="#e2e8f0"/>

  <!-- Divider line -->
  <rect x="190" y="262" width="220" height="1" rx="0.5" fill="#e2e8f0"/>

  <!-- Mini calendar grid: 3 columns x 3 rows -->
  <g>
    <!-- Row 1 -->
    <rect class="cal-cell" x="210" y="284" width="40" height="32" rx="6" fill="#14b8a6"/>
    <rect class="cal-cell" x="260" y="284" width="40" height="32" rx="6" fill="#f1f5f9"/>
    <rect class="cal-cell" x="310" y="284" width="40" height="32" rx="6" fill="#14b8a6"/>

    <!-- Row 2 -->
    <rect class="cal-cell" x="210" y="326" width="40" height="32" rx="6" fill="#f1f5f9"/>
    <rect class="cal-cell" x="260" y="326" width="40" height="32" rx="6" fill="#14b8a6"/>
    <rect class="cal-cell" x="310" y="326" width="40" height="32" rx="6" fill="#f1f5f9"/>

    <!-- Row 3 -->
    <rect class="cal-cell" x="210" y="368" width="40" height="32" rx="6" fill="#14b8a6"/>
    <rect class="cal-cell" x="260" y="368" width="40" height="32" rx="6" fill="#f1f5f9"/>
    <rect class="cal-cell" x="310" y="368" width="40" height="32" rx="6" fill="#f1f5f9"/>
  </g>

  <!-- Decorative accent dots -->
  <circle cx="168" cy="104" r="4" fill="#22d3ee" opacity="0.5"/>
  <circle cx="432" cy="104" r="4" fill="#22d3ee" opacity="0.5"/>
  <circle cx="168" cy="340" r="3" fill="#14b8a6" opacity="0.3"/>
  <circle cx="432" cy="340" r="3" fill="#14b8a6" opacity="0.3"/>
</svg>
