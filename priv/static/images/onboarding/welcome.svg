<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes button-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }
    @keyframes slot-pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.65; }
    }
    .booking-card { animation: float 3s ease-in-out infinite; }
    .submit-btn { animation: button-glow 2.4s ease-in-out infinite; }
    .pulse-slot { animation: slot-pulse 2.8s ease-in-out infinite; }
  </style>

  <!-- Main card container -->
  <rect x="40" y="30" width="520" height="440" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header bar -->
  <rect x="40" y="30" width="520" height="56" rx="16" fill="#f1f5f9"/>
  <rect x="40" y="70" width="520" height="16" fill="#f1f5f9"/>
  <!-- Header dots (window controls) -->
  <circle cx="72" cy="58" r="6" fill="#e2e8f0"/>
  <circle cx="92" cy="58" r="6" fill="#e2e8f0"/>
  <circle cx="112" cy="58" r="6" fill="#e2e8f0"/>
  <!-- Header placeholder bars -->
  <rect x="420" y="50" width="50" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="480" y="50" width="50" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Day column headers -->
  <rect x="70" y="104" width="120" height="24" rx="6" fill="#f1f5f9"/>
  <rect x="70" y="108" width="60" height="16" rx="4" fill="#cbd5e1"/>

  <rect x="200" y="104" width="120" height="24" rx="6" fill="#f1f5f9"/>
  <rect x="200" y="108" width="60" height="16" rx="4" fill="#cbd5e1"/>

  <rect x="330" y="104" width="120" height="24" rx="6" fill="#f1f5f9"/>
  <rect x="330" y="108" width="60" height="16" rx="4" fill="#cbd5e1"/>

  <!-- Column dividers -->
  <line x1="195" y1="100" x2="195" y2="430" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="325" y1="100" x2="325" y2="430" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Hour grid lines -->
  <line x1="60" y1="170" x2="455" y2="170" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="60" y1="220" x2="455" y2="220" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="60" y1="270" x2="455" y2="270" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="60" y1="320" x2="455" y2="320" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="60" y1="370" x2="455" y2="370" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Column 1 time blocks -->
  <!-- Available (turquoise) -->
  <rect x="78" y="148" width="108" height="44" rx="8" fill="#14b8a6" opacity="0.9"/>
  <rect x="86" y="158" width="52" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
  <rect x="86" y="170" width="36" height="6" rx="3" fill="#ffffff" opacity="0.4"/>

  <!-- Booked (cyan) -->
  <rect x="78" y="228" width="108" height="56" rx="8" fill="#22d3ee" opacity="0.85"/>
  <rect x="86" y="240" width="48" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
  <rect x="86" y="252" width="64" height="6" rx="3" fill="#ffffff" opacity="0.4"/>

  <!-- Available (turquoise) -->
  <rect x="78" y="340" width="108" height="38" rx="8" fill="#14b8a6" opacity="0.9"/>
  <rect x="86" y="352" width="44" height="6" rx="3" fill="#ffffff" opacity="0.6"/>

  <!-- Column 2 time blocks -->
  <!-- Blocked (neutral) -->
  <rect x="208" y="155" width="108" height="36" rx="8" fill="#e2e8f0"/>
  <rect x="216" y="166" width="40" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Available (turquoise) — pulsing slot -->
  <g class="pulse-slot">
    <rect x="208" y="240" width="108" height="50" rx="8" fill="#14b8a6" opacity="0.9"/>
    <rect x="216" y="252" width="56" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
    <rect x="216" y="264" width="38" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Booked (cyan) -->
  <rect x="208" y="355" width="108" height="44" rx="8" fill="#22d3ee" opacity="0.85"/>
  <rect x="216" y="367" width="50" height="6" rx="3" fill="#ffffff" opacity="0.6"/>

  <!-- Column 3 time blocks -->
  <!-- Booked (cyan) -->
  <rect x="338" y="142" width="108" height="48" rx="8" fill="#22d3ee" opacity="0.85"/>
  <rect x="346" y="154" width="46" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
  <rect x="346" y="166" width="60" height="6" rx="3" fill="#ffffff" opacity="0.4"/>

  <!-- Blocked (neutral) -->
  <rect x="338" y="260" width="108" height="32" rx="8" fill="#e2e8f0"/>
  <rect x="346" y="270" width="44" height="6" rx="3" fill="#cbd5e1"/>

  <!-- Available (turquoise) -->
  <rect x="338" y="330" width="108" height="46" rx="8" fill="#14b8a6" opacity="0.9"/>
  <rect x="346" y="342" width="52" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
  <rect x="346" y="354" width="34" height="6" rx="3" fill="#ffffff" opacity="0.4"/>

  <!-- Booking form overlay card -->
  <g class="booking-card" filter="url(#shadow)">
    <rect x="380" y="180" width="160" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Form header area -->
    <rect x="392" y="196" width="80" height="8" rx="4" fill="#14b8a6"/>
    <rect x="392" y="212" width="120" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Form divider -->
    <line x1="392" y1="230" x2="528" y2="230" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Clock icon -->
    <circle cx="404" cy="250" r="10" stroke="#14b8a6" stroke-width="2" fill="none"/>
    <line x1="404" y1="244" x2="404" y2="250" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
    <line x1="404" y1="250" x2="409" y2="253" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
    <!-- Clock label placeholder -->
    <rect x="420" y="246" width="56" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Form input fields -->
    <rect x="392" y="276" width="136" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="400" y="286" width="64" height="6" rx="3" fill="#cbd5e1"/>

    <rect x="392" y="314" width="136" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="400" y="324" width="48" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Submit button -->
    <g class="submit-btn">
      <rect x="392" y="356" width="136" height="32" rx="8" fill="#14b8a6"/>
      <rect x="432" y="368" width="56" height="8" rx="4" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>

  <!-- Decorative dot pattern (top-right) -->
  <circle cx="530" cy="50" r="2" fill="#22d3ee" opacity="0.4"/>
  <circle cx="542" cy="50" r="2" fill="#22d3ee" opacity="0.3"/>
  <circle cx="530" cy="62" r="2" fill="#22d3ee" opacity="0.3"/>

  <!-- Shadow filter -->
  <defs>
    <filter id="shadow" x="-8%" y="-4%" width="120%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>
