[changelog]
header = "# Changelog\n\nAll notable changes to Tymeslot are documented here. Versions follow [semantic versioning](https://semver.org).\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
filter_commits = true
topo_order = false
sort_commits = "newest"

commit_parsers = [
  # Skip commits explicitly marked as changelog-internal.
  # git-cliff reconstructs a footer as "token:value" with no space after the
  # separator, so a "^Changelog: skip" pattern (with a space) never matches and
  # the skip silently does nothing. Match the spaceless form.
  { footer = "^Changelog:\\s*skip", skip = true },
  # Breaking changes — must come before feat/fix to avoid duplication.
  # Match on the resolved `breaking` field, not the `breaking = true` parser key:
  # git-cliff finalises the breaking flag after parser-key matching, so the key
  # form never fires and breaking commits silently fall through to Features/Fixes.
  { field = "breaking", pattern = "true", group = "Breaking Changes" },
  # Skip test, refactor, style, chore, docs commits
  { message = "^test", skip = true },
  { message = "^refactor", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  # Include features and bug fixes
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  # Skip everything else
  { message = ".*", skip = true },
]
