name: Build and Push Cloudron Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only run on GitHub, not Gitea
    if: github.server_url == 'https://github.com'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from mix.exs
        id: version
        run: |
          VERSION=$(grep -m 1 'version:' mix.exs | sed 's/.*version: "\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: luka1thb/tymeslot-cloudron
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Cloudron Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cloudron
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=luka1thb/tymeslot-cloudron:buildcache
          cache-to: type=registry,ref=luka1thb/tymeslot-cloudron:buildcache,mode=max
