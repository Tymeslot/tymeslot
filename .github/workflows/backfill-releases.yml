name: Backfill GitHub Releases

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print what would be created without creating anything'
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    # One-time backfill — disable this workflow after all releases have been created
    if: github.server_url == 'https://github.com'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          CLIFF_VERSION="2.12.0"
          curl -sSfLo /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          BINARY=$(find /tmp -name 'git-cliff' -type f | head -1)
          sudo install -m 755 "$BINARY" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Backfill releases
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          PREV_TAG=""

          while IFS= read -r TAG; do
            if gh release view "$TAG" &>/dev/null; then
              echo "[$TAG] already exists, skipping"
              PREV_TAG="$TAG"
              continue
            fi

            if [ -n "$PREV_TAG" ]; then
              git cliff "${PREV_TAG}..${TAG}" --strip all > /tmp/release-notes.md
            else
              git cliff --tag "$TAG" --strip all > /tmp/release-notes.md
            fi

            if [ -z "$(cat /tmp/release-notes.md | tr -d '[:space:]')" ]; then
              echo "_No user-facing changes in this release._" > /tmp/release-notes.md
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "--- DRY RUN: would create release $TAG ---"
              cat /tmp/release-notes.md
              echo "---"
            else
              gh release create "$TAG" \
                --title "$TAG" \
                --notes-file /tmp/release-notes.md \
                --verify-tag
              echo "[$TAG] created"
            fi

            PREV_TAG="$TAG"
          done < <(git tag --sort=version:refname | grep '^v')
        env:
          GH_TOKEN: ${{ github.token }}
