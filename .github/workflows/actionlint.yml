name: Lint workflows

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # Only run on GitHub, not Gitea
    if: github.server_url == 'https://github.com'
    env:
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # shellcheck runs over the embedded `run:` blocks, which is the point:
      # release.yml, docker-publish.yml and cloudron-publish.yml carry the shell
      # least covered by anything else in the gate.
      - name: Lint workflows
        run: actionlint -color
