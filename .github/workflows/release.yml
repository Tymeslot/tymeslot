name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          CLIFF_VERSION="2.12.0"
          curl -sSfLo /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          sudo tar -xzf /tmp/git-cliff.tar.gz -C /usr/local/bin --strip-components=1 "git-cliff-${CLIFF_VERSION}/git-cliff"
          git-cliff --version

      - name: Create releases
        run: |
          TAGS=$(git tag -l 'v*' | sort -V)

          for TAG in $TAGS; do
            if gh api "repos/${{ github.repository }}/releases/tags/$TAG" &>/dev/null 2>&1; then
              echo "Release $TAG already exists, skipping"
              continue
            fi

            PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git cliff "${PREV}..${TAG}" --tag "$TAG" --strip all > /tmp/release-notes.md
            else
              git cliff --tag "$TAG" --strip all > /tmp/release-notes.md
            fi

            if [ -z "$(cat /tmp/release-notes.md | tr -d '[:space:]')" ]; then
              echo "_No user-facing changes in this release._" > /tmp/release-notes.md
            fi

            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
            echo "Created release for $TAG"
          done
        env:
          GH_TOKEN: ${{ github.token }}
