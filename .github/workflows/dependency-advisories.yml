name: Dependency advisories

# `mix hex.audit` checks mix.lock against the live Hex registry's security
# advisories and retirements. Unlike `mix deps.audit`, whose advisory database
# is frozen into its release and so can only change its answer when mix.lock
# does, this one changes its answer whenever an advisory is published, with no
# commit at all. In `verify.yml` that turned main red overnight and skipped the
# test suite behind it, reporting "main is unhealthy" when the real message is
# "update this dependency as soon as possible".
#
# A run of its own says exactly that: a red run here means a locked package has
# a published advisory or was retired, and the fix is a dependency bump. It
# never blocks a push or a pull request.
on:
  schedule:
    # Nightly at 04:37 UTC, off the hour (GitHub's scheduler is most contended
    # at :00) and clear of the other nightly jobs.
    - cron: "37 4 * * *"
  # Manual trigger, to confirm a bump cleared the advisory or to check before
  # cutting a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hex-audit:
    runs-on: ubuntu-latest
    # Only run on GitHub, not Gitea
    if: github.server_url == 'https://github.com'
    env:
      ELIXIR_VERSION: "1.20.4"
      OTP_VERSION: "28.5.0.7"
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      # Read-only restore: the audit needs the project to load, not a build, so
      # there is nothing worth saving back.
      - uses: actions/cache/restore@v5
        with:
          path: deps
          key: ${{ runner.os }}-elixir-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-elixir-${{ env.ELIXIR_VERSION }}-otp-${{ env.OTP_VERSION }}-mix-${{ hashFiles('mix.lock') }}-
      - run: mix deps.get
      - run: mix hex.audit
