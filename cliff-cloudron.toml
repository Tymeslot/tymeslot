[changelog]
header = ""
body = """
{% if version %}\
[{{ version | trim_start_matches(pat="v") }}]
{% for group, commits in commits | group_by(attribute="group") %}\
{% for commit in commits %}\
* {% if commit.breaking %}[BREAKING] {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\
{% endif %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
filter_commits = true
topo_order = false
sort_commits = "newest"

commit_parsers = [
  { footer = "^Changelog: skip", skip = true },
  { field = "scope", pattern = "saas", skip = true },
  # Match the resolved `breaking` field, not the `breaking = true` parser key —
  # git-cliff finalises the flag after key matching, so the key form never fires.
  { field = "breaking", pattern = "true", group = "Breaking Changes" },
  { message = "^test", skip = true },
  { message = "^refactor", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = ".*", skip = true },
]
