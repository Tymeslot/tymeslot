[changelog]
header = ""
# With `saas`-scoped commits skipped below, `core` is the scope on all but a
# handful of the entries that remain, so printing it would repeat the same
# prefix down the whole list. Narrower scopes still say something and are kept.
body = """
{% if version %}\
[{{ version | trim_start_matches(pat="v") }}]
{% for group, commits in commits | group_by(attribute="group") %}\
{% for commit in commits %}\
* {% if commit.breaking %}[BREAKING] {% endif %}{% if commit.scope and commit.scope != "core" %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\
{% endif %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
filter_commits = true
topo_order = false
sort_commits = "newest"

commit_parsers = [
  # git-cliff drops the space after the separator when reconstructing a footer,
  # so "^Changelog: skip" (spaced) never matches; use the spaceless form.
  { footer = "^Changelog:\\s*skip", skip = true },
  { field = "scope", pattern = "saas", skip = true },
  # Match the resolved `breaking` field, not the `breaking = true` parser key —
  # git-cliff finalises the flag after key matching, so the key form never fires.
  { field = "breaking", pattern = "true", group = "Breaking Changes" },
  { message = "^test", skip = true },
  { message = "^refactor", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = ".*", skip = true },
]
