[changelog]
header = ""
# `core` and `saas` are retired scopes, refused at commit time, but they run
# throughout the history before that change. `saas`-scoped commits are skipped
# below, and with them gone `core` is the scope on all but a handful of the
# entries that remain, so printing it would repeat the same prefix down the
# whole list. A narrower scope names a domain and still says something, so it
# is kept.
#
# A breaking change carries its `BREAKING CHANGE:` footer on the same line,
# because the subject says what changed but only the footer says what an
# operator must do about it. Same line, not an indented one: when a release has
# curated highlights, `mix set_version` keeps only the lines containing
# `[BREAKING]` from this section. The bare `type!:` form sets the description to
# the subject itself, which is not repeated.
body = """
{% if version %}\
[{{ version | trim_start_matches(pat="v") }}]
{% for group, commits in commits | group_by(attribute="group") %}\
{% for commit in commits %}\
* {% if commit.breaking %}[BREAKING] {% endif %}{% if commit.scope and commit.scope != "core" %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}: {{ commit.breaking_description | replace(from="\n", to=" ") }}{% endif %}
{% endfor %}\
{% endfor %}\
{% endif %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
filter_commits = true
topo_order = false
sort_commits = "newest"

commit_parsers = [
  # git-cliff drops the space after the separator when reconstructing a footer,
  # so "^Changelog: skip" (spaced) never matches; use the spaceless form.
  { footer = "^Changelog:\\s*skip", skip = true },
  { field = "scope", pattern = "saas", skip = true },
  # Match the resolved `breaking` field, not the `breaking = true` parser key —
  # git-cliff finalises the flag after key matching, so the key form never fires.
  { field = "breaking", pattern = "true", group = "Breaking Changes" },
  { message = "^test", skip = true },
  { message = "^refactor", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = ".*", skip = true },
]
